<script>
'use strict';
// A tiny Extended Color BASIC + MC6847 machine, just big enough to run the
// original listing verbatim. Timings are measured against XRoar (60Hz ticks).
const VERSION = '1.6'; // bump on every release; shown on the start screen
const SPEED = 1; // ponytail: calibration knob, >1 = slower than a real CoCo

// ---------- palette (sampled from XRoar) ----------
const rgb = (r, g, b) => (0xff000000 | b << 16 | g << 8 | r) >>> 0;
const GREEN = rgb(46,188,36), YELLOW = rgb(255,255,151), BLUE = rgb(44,37,129), RED = rgb(131,26,55),
  BUFF = rgb(255,255,255), CYAN = rgb(40,224,170), MAGENTA = rgb(255,60,255), ORANGE = rgb(255,130,40),
  BLACK = rgb(0,0,0), INK = rgb(0,31,0), ART_L = rgb(236,120,83), ART_R = rgb(70,200,255);
const PAL4 = [[GREEN, YELLOW, BLUE, RED], [BUFF, CYAN, MAGENTA, ORANGE]];
const CURSOR = [GREEN, YELLOW, BLUE, RED, BUFF, CYAN, MAGENTA, ORANGE];

// MC6847 internal font, ASCII 32..95, glyph rows 3..9 of the 8x12 cell (dumped from XRoar)
const FONT = '00000000000000080808080800081414140000000014143600361414081E201C023C0832320408102626102828102A241A18181800000000081020202010080804020202040800081C3E1C08000008083E080800000000303010200000003E0000000000000000303002020408102020182424242424180818080808081C1C22021C20203E1C22020C02221C040C143E0404043E203C0202221C1C20203C22221C3E0204081020201C22221C22221C1C22221E02021C00181800181800181800181808100408102010080400003E003E000010080402040810182404080800081C22021A2A2A1C081422223E22223C12121C12123C1C22202020221C3C12121212123C3E20203C20203E3E20203C2020201E20202622221E2222223E2222221C08080808081C0202020222221C222428302824222020202020203E22362A2A22222222322A262222223E22222222223E3C22223C2020201C2222222A241A3C22223C2824221C22100804221C3E0808080808082222222222221C222222141408082222222A2A362222221408142222222214080808083E02040810203E38202020202038202010080402020E02020202020E081C2A080808080008103E100800';
const glyph = (g, r) => r < 3 || r > 9 ? 0 : parseInt(FONT.substr((g * 7 + r - 3) * 2, 2), 16);

// ---------- machine state ----------
const T = new Uint8Array(512).fill(32); // text screen (ASCII)
let cur = 0;                            // text cursor
const VR = new Uint8Array(6144);        // graphics pages 1-4
let gfx = false, css = 0, pmode = 2, fg = 1, bg = 0, gx = 128, gy = 96;
let vars = {}, stack = [], prog = [], li = -1, L = [], p = 0, running = false;
let vt = performance.now(), tBase = vt, cost = 0, fixedCost = -1;
let keyBuf = 0, inputLine = '', autotype = '';
const held = new Set(), latch = new Map();
let oct = 2, nlen = 4, tempo = 2, vol = 15;

// ---------- text output ----------
function putc(c) {
  if (c === 13) { do T[cur++] = 32; while (cur & 31); }
  else if (c === 8) { if (cur > 0) T[--cur] = 32; return; }
  else T[cur++] = c;
  if (cur >= 512) { T.copyWithin(0, 32); T.fill(32, 480); cur -= 32; }
}
const out = s => { for (const ch of s) putc(ch.charCodeAt(0)); cost += s.length * 0.05; };
const num2s = n => {
  let s = Number.isInteger(n) && Math.abs(n) < 1e9 ? String(Math.abs(n)) : String(parseFloat(Math.abs(n).toPrecision(9)));
  if (s.startsWith('0.')) s = s.slice(1);
  return (n < 0 ? '-' : ' ') + s;
};

// ---------- tokenizer (crunch keywords anywhere, like Color BASIC) ----------
const KW = ['INKEY$','STR$','CHR$','TIMER','PRINT','PRESET','PSET','PMODE','PCLS','PAINT','PLAY','PEEK','SCREEN',

          if (isP(',')) { p++; s = numArg(); if (isP(',')) { p++; e = numArg(); } } } }
      circle(x, y, r, c, hw, s, e); return;
    }
    case 'PAINT': {
      const [x, y] = xy(); let c = fg, b = fg;
      if (isP(',')) { p++; c = colorBits(numArg()); if (isP(',')) { p++; b = colorBits(numArg()); } }
      paint(x, y, c, b); return;
    }
    case 'DRAW': { const s = expr(); if (typeof s !== 'string') err('TM'); draw(s); return; }
    case 'PLAY': { const s = expr(); if (typeof s !== 'string') err('TM'); play(s); return; }
    case 'END': return stop();
    case 'RUN': { const n = p < L.length && L[p].k === 'N' ? L[p].v : null; run(); if (n !== null) gotoLine(n); return; }
    case 'LIST': {
      let a = 0, b = 1e9;
      if (p < L.length && L[p].k === 'N') a = b = L[p++].v;
      if (isP('-')) { p++; b = p < L.length && L[p].k === 'N' ? L[p++].v : 1e9; }
      for (const x of prog) if (x.n >= a && x.n <= b) { out(x.n + ' ' + x.src); putc(13); }
      return stop();
    }
  }
  err('SN');
}

function step() {
  cost = 0; fixedCost = -1;
  const L0 = L, p0 = p, ln = li >= 0 ? prog[li].n : -1;
  try { stmt(); }
  catch (e) { if (!(e instanceof BasicError)) throw e; stop('?' + e.code + ' ERROR' + (ln >= 0 ? ' IN ' + ln : '')); }
  // interpreter cost: per token, plus ASCII->float conversion of every numeric constant (measured in XRoar)
  let tk = 1;
  if (L === L0) { tk = 0; for (let i = p0; i < p; i++) tk += 0.35 + (L[i].k === 'N' ? String(L[i].v).length * 0.8 : 0); }
  vt += SPEED * (fixedCost >= 0 ? fixedCost : 0.3 + cost + tk);
}

// ---------- video ----------
const cv = document.getElementById('scr'), ctx = cv.getContext('2d');
const img = ctx.createImageData(320, 240), px = new Uint32Array(img.data.buffer);
function render(now) {
  px.fill(gfx ? (css ? BUFF : GREEN) : BLACK);
  if (gfx) {
    const f = four(), xd = xdiv(), yd = ydiv(), b = bpr();
    for (let y = 0; y < 192; y++) {
      const row = (y / yd | 0) * b, o = (y + 24) * 320 + 32;
      for (let x = 0; x < 256; x++) {
        const X = x / xd | 0;
        let c;
        if (f) c = PAL4[css][VR[row + (X >> 2)] >> (6 - 2 * (X & 3)) & 3];
        else if (pmode === 4 && css) { // NTSC artifact colours
          const x0 = x & ~1, l = VR[row + (x0 >> 3)] >> (7 - (x0 & 7)) & 1, r = VR[row + (x0 >> 3)] >> (6 - (x0 & 7)) & 1;
          c = l && r ? BUFF : l ? ART_L : r ? ART_R : BLACK;
        } else c = VR[row + (X >> 3)] >> (7 - (X & 7)) & 1 ? (css ? BUFF : GREEN) : BLACK;
        px[o + x] = c;
      }
    }
  } else {
    const blink = !running && ((now / 250) | 0) % 2 === 0;
    for (let i = 0; i < 512; i++) {
      const ch = T[i], inv = ch >= 96, g = inv ? ch - 64 : ch >= 32 && ch < 96 ? ch - 32 : 0;
      const ox = 32 + (i & 31) * 8, oy = 24 + (i >> 5) * 12;
      const block = !running && i === cur ? CURSOR[((now / 250) | 0) % 8] : 0;
      for (let r = 0; r < 12; r++) {
        const bits = glyph(g, r), o = (oy + r) * 320 + ox;
        for (let c = 0; c < 8; c++) px[o + c] = block && blink ? block : ((bits >> (7 - c)) & 1) !== +inv ? INK : GREEN;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

// ---------- main loop ----------
let nextAuto = 0;
function frame(now) {
  if (running) {
    if (vt < now - 50) vt = now - 50;
    for (let n = 0; running && vt < now && n < 200000; n++) step();
  } else if (autotype && now > nextAuto) { typeKey(autotype.charCodeAt(0)); autotype = autotype.slice(1); nextAuto = now + 150; }
  render(now);
  requestAnimationFrame(frame);
}

for (const s of document.getElementById('bas').textContent.split('\n')) {
  const m = /^(\d+) ?(.*)$/.exec(s.trimEnd());
  if (m) setLine(+m[1], m[2]);
}
out('EXTENDED COLOR BASIC 1.1'); putc(13);
out('COPR. 1980, 1981 BY TANDY'); putc(13);
out('UNDER LICENSE FROM MICROSOFT'); putc(13); putc(13);
out('RETURN TO THE CASTLE V' + VERSION); putc(13); putc(13);
out('OK'); putc(13);
autotype = 'RUN\r'; nextAuto = performance.now() + 1200;
requestAnimationFrame(frame);
</script>
